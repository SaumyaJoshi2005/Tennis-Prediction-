# docker-compose.yml
# ===================
# BUGS FIXED
# ----------
# 1. Password mismatch: MySQL had MYSQL_ROOT_PASSWORD=123 but database.py
#    expected 'password'. Both now share DB_PASSWORD env var = tennis123.
#
# 2. No health checks: API container started before MySQL was ready,
#    causing "Can't connect to MySQL" crashes on first boot.
#    Fixed: healthcheck on mysql + depends_on condition on api.
#
# 3. No volume for MySQL: all data was lost on every container restart.
#    Fixed: named volume mysql_data mounted at /var/lib/mysql.
#
# 4. Redis host in cache.py was 'localhost' — works now because
#    REDIS_HOST=redis is passed as an env var to the api service.

services:

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # FIX 1: credentials passed as env vars — database.py reads these
      DB_USER:         root
      DB_PASSWORD:     tennis123
      DB_HOST:         mysql
      DB_PORT:         "3306"
      DB_NAME:         tennis_db
      # FIX 4: tells cache.py to use 'redis' not 'localhost'
      REDIS_HOST:      redis
      REDIS_PORT:      "6379"
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"
    depends_on:
      mysql:
        # FIX 2: wait for MySQL to pass its healthcheck before starting API
        condition: service_healthy
      redis:
        condition: service_started

  mysql:
    image: mysql:8.0
    restart: always
    environment:
      # FIX 1: password now matches DB_PASSWORD in api service
      MYSQL_ROOT_PASSWORD: tennis123
      MYSQL_DATABASE:      tennis_db
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password
    # FIX 3: named volume so data survives container restarts
    volumes:
      - mysql_data:/var/lib/mysql
    # FIX 2: healthcheck so api service waits until MySQL is truly ready
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ptennis123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always

# FIX 3: declare the named volume
volumes:
  mysql_data:
